services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: support_ticket
      POSTGRES_USER: support_ticket
      POSTGRES_PASSWORD: support_ticket
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DB_NAME: support_ticket
      DB_USER: support_ticket
      DB_PASSWORD: support_ticket
      DB_HOST: db
      DB_PORT: 5432
      LLM_API_KEY: ${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}
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
